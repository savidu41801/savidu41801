# WHERE THIS FILE GOES
# In your GitHub profile repo (the one named exactly like your username),
# create the folders .github/workflows/ and save this file there as:
#   .github/workflows/snake-workflow.yml
#
# WHAT IT DOES
# Once a day (and any time you run it manually from the "Actions" tab),
# it reads your GitHub contribution graph, turns it into a snake-game
# animation, and publishes the SVGs to a branch called "output" — which is
# exactly what the <picture> block in README.md points to.
#
# FIRST RUN
# Go to your repo's "Actions" tab, select "Generate Snake Animation" on the
# left, and click "Run workflow" once. After that it keeps itself updated.

name: Generate Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Generate the snake animation SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: Push the SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
